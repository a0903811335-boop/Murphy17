          }
        ],
        defaultFallback: "「同是天涯淪落人，相逢何必曾相識！」真誠的情感沒有古今之分，用心感受人間冷暖，寫下的文字便有千鈞之力。"
      }
    ];

    // --- State Management ---
    let currentAuthorId = "libai";
    let chatHistories = {}; // { authorId: [ { sender: 'user'|'author', text: '' } ] }
    let currentCategory = "all";
    let isGenerating = false;

    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
      // Init greetings in history
      authorsData.forEach(a => {
        chatHistories[a.id] = [
          { sender: 'author', text: a.greeting }
        ];
      });

      renderAuthorList();
      selectAuthor("libai");

      // Enter key setup
      const userInput = document.getElementById('user-input');
      userInput.addEventListener('input', (e) => {
        const clearBtn = document.getElementById('btn-clear-input');
        if (e.target.value.trim().length > 0) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }
      });
    });

    // --- Render Author List Left Panel ---
    function renderAuthorList() {
      const listEl = document.getElementById('author-list');
      const filtered = authorsData.filter(a => {
        if (currentCategory === 'all') return true;
        return a.category === currentCategory;
      });

      document.getElementById('authors-count').innerText = `${filtered.length} 位名家`;

      let html = '';
      filtered.forEach(a => {
        const isActive = (a.id === currentAuthorId) ? 'active ring-2 ring-lilac-500' : '';
        html += `
          <div onclick="selectAuthor('${a.id}')" class="author-card ${isActive} p-3.5 rounded-2xl border border-slate-200 hover:border-lilac-400 bg-white hover:bg-lilac-50/50 cursor-pointer transition flex items-center justify-between gap-3 group">
            <div class="flex items-center space-x-3 min-w-0">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr ${a.iconBg} text-white flex items-center justify-center text-base shadow-xs shrink-0 group-hover:scale-105 transition">
                <i class="${a.icon}"></i>
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                  <h4 class="font-serif font-black text-sm text-slate-900 group-hover:text-lilac-900 truncate">${a.name}</h4>
                  <span class="text-[10px] px-1.5 py-0.2 rounded font-semibold ${a.badgeColor} shrink-0">${a.badge}</span>
                </div>
                <p class="text-[11px] text-slate-500 truncate mt-0.5">${a.style}</p>
              </div>
            </div>
            <i class="fa-solid fa-chevron-right text-xs text-slate-300 group-hover:text-lilac-600 transition shrink-0"></i>
          </div>
        `;
      });
      listEl.innerHTML = html;
    }

    function filterAuthorCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(b => {
        b.className = "cat-tab flex-1 py-1.5 font-medium rounded-lg text-slate-600 hover:text-slate-900 transition";
      });
      const activeBtn = document.getElementById(`cat-${cat}`);
      if (activeBtn) {
        activeBtn.className = "cat-tab active flex-1 py-1.5 font-bold rounded-lg bg-white text-lilac-900 shadow-xs transition";
      }
      renderAuthorList();
    }

    // --- Select Author & Switch Chat Context ---
    function selectAuthor(authorId) {
      currentAuthorId = authorId;
      const author = authorsData.find(a => a.id === authorId);
      if (!author) return;

      // Update Top Chat Header Info
      document.getElementById('current-author-name').innerText = author.name;
      document.getElementById('current-author-badge').innerText = author.badge;
      document.getElementById('current-author-badge').className = `px-2 py-0.5 text-[10px] font-bold rounded-full border shrink-0 ${author.badgeColor}`;
      document.getElementById('current-author-quote').innerText = author.quote;
      document.getElementById('current-author-dynasty').innerText = author.dynasty;
      document.getElementById('current-author-style').innerText = author.style;
      
      const avatarEl = document.getElementById('current-author-avatar');
      avatarEl.className = `w-12 h-12 rounded-2xl bg-gradient-to-tr ${author.iconBg} text-white flex items-center justify-center text-xl shadow-md shrink-0`;
      avatarEl.innerHTML = `<i class="${author.icon}"></i>`;

      // Update Preset Pills
      renderPresetQuestions(author.presets);

      // Render Messages
      renderChatMessages();

      // Refresh left active list
      renderAuthorList();
    }

    function renderPresetQuestions(presets) {
      const container = document.getElementById('preset-questions');
      if (!presets || presets.length === 0) {
        container.innerHTML = '';
        return;
      }
      let html = '';
      presets.forEach(p => {
        html += `
          <button onclick="askPresetQuestion('${escapeQuotes(p)}')" class="px-3 py-1 bg-white hover:bg-lilac-100 text-lilac-900 text-xs font-semibold rounded-full border border-lilac-200 shadow-xs hover:border-lilac-400 transition whitespace-nowrap">
            💬 ${p}
          </button>
        `;
      });
      container.innerHTML = html;
    }

    function renderChatMessages() {
      const container = document.getElementById('chat-messages');
      const author = authorsData.find(a => a.id === currentAuthorId);
      const history = chatHistories[currentAuthorId] || [];

      let html = '';
      history.forEach((msg, idx) => {
        if (msg.sender === 'user') {
          html += `
            <div class="flex items-start justify-end space-x-2">
              <div class="chat-bubble-user max-w-[80%] sm:max-w-[70%] p-3.5 sm:p-4 rounded-2xl rounded-tr-none text-xs sm:text-sm leading-relaxed shadow-sm">
                ${escapeHtml(msg.text)}
              </div>
              <div class="w-8 h-8 rounded-full bg-lilac-200 text-lilac-900 flex items-center justify-center text-xs font-bold shrink-0">
                我
              </div>
            </div>
          `;
        } else {
          html += `
            <div class="flex items-start space-x-2.5">
              <div class="w-9 h-9 rounded-xl bg-gradient-to-tr ${author.iconBg} text-white flex items-center justify-center text-sm shadow-xs shrink-0 mt-0.5">
                <i class="${author.icon}"></i>
              </div>
              <div class="chat-bubble-author max-w-[85%] sm:max-w-[75%] p-3.5 sm:p-4 rounded-2xl rounded-tl-none text-xs sm:text-sm leading-relaxed shadow-sm text-slate-800 space-y-1">
                <div class="text-[11px] font-bold text-lilac-800 font-serif">${author.name}</div>
                <div class="font-serif leading-relaxed text-slate-800">${formatResponseText(msg.text)}</div>
              </div>
            </div>
          `;
        }
      });

      container.innerHTML = html;
      container.scrollTop = container.scrollHeight;
    }

    // --- Message Submission & AI Response Generation ---
    function handleUserSubmit(e) {
      if (e) e.preventDefault();
      if (isGenerating) return;

      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      document.getElementById('btn-clear-input').classList.add('hidden');

      // Append User message
      chatHistories[currentAuthorId].push({ sender: 'user', text: text });
      renderChatMessages();

      // Trigger Author Response
      generateAuthorResponse(text);
    }

    function askPresetQuestion(text) {
      if (isGenerating) return;
      chatHistories[currentAuthorId].push({ sender: 'user', text: text });
      renderChatMessages();
      generateAuthorResponse(text);
    }

    function generateAuthorResponse(userQuery) {
      isGenerating = true;
      const sendBtn = document.getElementById('btn-send');
      sendBtn.disabled = true;
      sendBtn.classList.add('opacity-50');

      const author = authorsData.find(a => a.id === currentAuthorId);
      const queryLower = userQuery.toLowerCase();

      // Match Best QA Pattern
      let reply = "";
      if (author.qaPatterns) {
        for (const pattern of author.qaPatterns) {
          const isMatch = pattern.keywords.some(kw => queryLower.includes(kw.toLowerCase()));
          if (isMatch) {
            reply = pattern.response;
            break;
          }
        }
      }

      if (!reply) {
        reply = author.defaultFallback;
      }

      // Show Typing Placeholder in Chat
      const container = document.getElementById('chat-messages');
      const tempId = 'typing-' + Date.now();
      const typingHtml = `
        <div id="${tempId}" class="flex items-start space-x-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr ${author.iconBg} text-white flex items-center justify-center text-sm shadow-xs shrink-0 mt-0.5">
            <i class="${author.icon}"></i>
          </div>
          <div class="chat-bubble-author max-w-[85%] sm:max-w-[75%] p-3.5 sm:p-4 rounded-2xl rounded-tl-none text-xs sm:text-sm leading-relaxed shadow-sm text-slate-800 space-y-1">
            <div class="text-[11px] font-bold text-lilac-800 font-serif">${author.name} 正在提筆沉思...</div>
            <div class="font-serif leading-relaxed text-slate-700 typing-cursor" id="${tempId}-text"></div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', typingHtml);
      container.scrollTop = container.scrollHeight;

      // Stream / Typewriter Effect
      let charIndex = 0;
      const textEl = document.getElementById(`${tempId}-text`);
      const speed = 25; // ms per character

      const interval = setInterval(() => {
        charIndex += 2;
        if (charIndex <= reply.length) {
          textEl.innerHTML = formatResponseText(reply.substring(0, charIndex));
          container.scrollTop = container.scrollHeight;
        } else {
          clearInterval(interval);
          textEl.classList.remove('typing-cursor');
          textEl.innerHTML = formatResponseText(reply);
          
          // Save to persistent history
          chatHistories[currentAuthorId].push({ sender: 'author', text: reply });
          
          isGenerating = false;
          sendBtn.disabled = false;
          sendBtn.classList.remove('opacity-50');
        }
      }, speed);
    }

    function resetCurrentChat() {
      const author = authorsData.find(a => a.id === currentAuthorId);
      if (!author) return;
      chatHistories[currentAuthorId] = [
        { sender: 'author', text: author.greeting }
      ];
      renderChatMessages();
    }

    function clearInput() {
      const input = document.getElementById('user-input');
      input.value = '';
      document.getElementById('btn-clear-input').classList.add('hidden');
      input.focus();
    }

    // Helper: Format line breaks and quotes gracefully
    function formatResponseText(str) {
      if (!str) return '';
      return escapeHtml(str)
        .replace(/\n/g, '<br>')
        .replace(/「([^」]+)」/g, '<strong class="text-lilac-900 font-bold">「$1」</strong>');
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'");
    }
  </script>

</body>
</html>
